name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test the package and print the fpm registry entry without opening a pull request
        type: boolean
        default: false
      submit:
        description: Open the fpm-registry pull request. Requires FPM_REGISTRY_TOKEN.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: fpm registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install fpm
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/fpm" \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x "$HOME/.local/bin/fpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: scripts/run-tests.sh
      - name: Publish
        env:
          FPM_REGISTRY_TOKEN: ${{ secrets.FPM_REGISTRY_TOKEN }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${PUBLISH_DRY_RUN}" == "true" ]]; then
            bash scripts/publish.sh --dry-run
          elif [[ "${PUBLISH_SUBMIT}" == "true" ]]; then
            bash scripts/publish.sh --submit
          else
            bash scripts/publish.sh
          fi
